services:
  - type: web
    name: rescue-coordination-api
    env: node
    rootDir: apps/api
    plan: free
    installCommand: corepack enable && pnpm install --frozen-lockfile
    buildCommand: pnpm build
    startCommand: pnpm start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: PORT
        value: 3001
      - key: CORS_ORIGIN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ORS_API_KEY
        sync: false
      - key: VALHALLA_URL
        sync: false